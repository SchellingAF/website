# Runs the website's tests on every push and on pull requests from forks.
#
# A pull request from a branch of this repository is already tested by the push
# that created the branch, so the job skips it: one run per change, not two.
#
# The site installs nothing. The service repository is checked out beside it as
# schellingaf-api, where the tests look for it: its pinned TypeScript checker
# type-checks src/, and the files this site copies from it are compared byte for
# byte. Without it those checks skip rather than fail.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# A newer run for the same branch, or the same pull request, replaces the one
# in progress. Pushes and pull requests never share a group, and a pull
# request is keyed by its number, so a fork's branch name cannot cancel a run
# of this repository.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: website
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SchellingAF/schelling
          path: schellingaf-api
          persist-credentials: false

      # package.json requires Node 26 or later.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: schellingaf-api/package-lock.json

      # The service's packages, for its pinned TypeScript checker only.
      - run: npm ci
        working-directory: schellingaf-api

      # So the test that serves a built file has one to serve.
      - run: npm run build
        working-directory: website

      - run: npm test
        working-directory: website
